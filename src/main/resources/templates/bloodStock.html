
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeDrop - Blood Stock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #c62828;
        }

        table {
            width: 90%;
            max-width: 650px;
            margin: 25px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
        }

        th {
            background: #c62828;
            color: white;
        }

        tr:nth-child(even) {
            background: #fff0f0;
        }

        a {
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #c62828;
            color: white;
            border: none;
            cursor: pointer;
        }

        .message {
            color: #c62828;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>LifeDrop Blood Stock</h1>
    <p>Available units by blood group</p>

    <p class="message" th:if="${message}" th:text="${message}"></p>

    <h3>Update Blood Stock</h3>

    <form action="/blood-stock/update" method="post">
        <select name="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option th:each="item : ${stock}"
                    th:value="${item.bloodGroup}"
                    th:text="${item.bloodGroup}">
            </option>
        </select>

        <input type="number"
               name="unitsAvailable"
               min="0"
               step="1"
               placeholder="Enter units"
               required>

        <button type="submit">Update Stock</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Blood Group</th>
                <th>Units Available</th>
            </tr>
        </thead>
       
<thead>
    <tr>
        <th>Blood Group</th>
        <th>Units Available</th>
        <th>Stock Status</th>
    </tr>
</thead>
<tbody>
    <tr th:each="item : ${stock}">
        <td th:text="${item.bloodGroup}">A+</td>

        <td th:text="${item.unitsAvailable}">0</td>

        <td>
            <span th:if="${item.unitsAvailable == 0}"
                  style="color: red; font-weight: bold;">
                Out of Stock
            </span>

            <span th:if="${item.unitsAvailable > 0 and item.unitsAvailable <= 5}"
                  style="color: orange; font-weight: bold;">
                Low Stock
            </span>

            <span th:if="${item.unitsAvailable > 5}"
                  style="color: green; font-weight: bold;">
                Available
            </span>
        </td>
    </tr>
</tbody>

    </table>

    <p><a href="/">Back to Home</a></p>
</body>
</html>
